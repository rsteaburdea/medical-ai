services:
  - type: web
    name: medical-ai-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: HF_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: https://rsteaburdea.github.io,http://localhost:5173,http://localhost:8080
      - key: PYTHON_VERSION
        value: "3.13"
